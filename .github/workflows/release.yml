name: release

# Publishes a GitHub Release (tarball + CHECKSUMS.txt) for the app when a
# version tag is pushed, or on demand with an explicit tag.
#
# The tag is the single source of version truth (issues #14/#16): the app's
# package.json must match the tag, the full suite must pass on the tagged tree,
# and the tarball produced here is exactly what the deployment pack fetches and
# SHA-verifies (scripts/fetch-release.sh). Nothing is copied between repos —
# the tag IS the release.
#
#   git tag v0.5.6 && git push origin v0.5.6        # or dispatch with "0.5.6"
#
# The tarball is the portable app only (no .env / k8s / vendored binaries /
# deployment identity); the internal image build lives in the deployment pack.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, without the leading v (e.g. 0.5.6)"
        required: true
        type: string
      dry_run:
        description: "Validate the full pipeline (tests, pack, checksums) but do NOT publish a Release"
        type: boolean
        default: false

permissions:
  contents: write # to create/update the GitHub Release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out (full history + tags so the tag can be resolved in-step)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the release tag (normalise dispatch input)
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.tag }}"
            [[ "$RAW" == v* ]] || RAW="v$RAW"
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          # Detach at the tag so the suite + tarball come from the tag's tree.
          git checkout --detach "refs/tags/${RAW}" 2>/dev/null \
            || { echo "::error::tag ${RAW} does not exist"; exit 1; }
          echo "tag=$RAW" >> "$GITHUB_OUTPUT"
          echo "dry_run=${{ github.event.inputs.dry_run == 'true' || false }}" >> "$GITHUB_OUTPUT"
          echo "Releasing $RAW${{ github.event.inputs.dry_run == 'true' && ' (DRY RUN — not publishing)' || '' }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (no runtime deps expected; tolerant)
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify version truth (tag == package.json version)
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PKG="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$PKG" ]]; then
            echo "::error::tag $TAG does not match package.json version $PKG"; exit 1
          fi
          echo "version truth OK: $TAG"

      - name: Release gate — full test suite on the tagged tree
        run: npm test

      - name: Build the release tarball (portable app only)
        run: |
          npm pack --silent
          ls -la ai-pr-reviewer-*.tgz

      - name: Harden — reject deployment identity / secrets in the tarball
        run: |
          set -euo pipefail
          TGZ="$(ls ai-pr-reviewer-*.tgz | head -1)"
          rm -rf /tmp/release-scan && mkdir -p /tmp/release-scan
          tar -xzf "$TGZ" -C /tmp/release-scan
          cd "$(find /tmp/release-scan -name package.json -not -path '*/node_modules/*' | head -1 | xargs dirname)"
          # Single source of truth: reuse the ban list that .githooks/pre-push
          # enforces, rather than duplicating it here (which would itself trip
          # the hook). Mirror the hook's exclusions: .githooks/ is excluded
          # because the hook must carry the list to enforce it, and LICENSE is
          # excluded because an MIT license names the copyright holder.
          BANNED="$(sed -n "s/^BANNED='\(.*\)'$/\1/p" .githooks/pre-push)"
          [[ -n "$BANNED" ]] || { echo "::error::could not read ban list from .githooks/pre-push"; exit 1; }
          BAD="$(grep -RIlE --exclude-dir=.githooks --exclude=LICENSE "$BANNED" . 2>/dev/null || true)"
          if [[ -n "$BAD" ]]; then
            echo "::error::deployment identity found in tarball:"
            echo "$BAD"
            exit 1
          fi
          for f in .env .env.dev k8s node_modules; do
            if [[ -e "$f" ]]; then echo "::error::forbidden path in tarball: $f"; exit 1; fi
          done
          echo "tarball scrub OK"

      - name: Write CHECKSUMS.txt (fetch-release.sh verifies against this)
        run: shasum -a 256 ai-pr-reviewer-*.tgz > CHECKSUMS.txt

      - name: Create / update the GitHub Release with both assets
        if: steps.tag.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: AI PR Reviewer ${{ steps.tag.outputs.tag }}
          body: |
            ## ${{ steps.tag.outputs.tag }}

            Release artifact produced by CI: the portable app tarball plus
            `CHECKSUMS.txt` for SHA-256 verification. The deployment pack
            fetches these assets via `scripts/fetch-release.sh`, so the app is
            never copied into the pack — the tag is the release.

            Changelog: see [CHANGELOG.md](./CHANGELOG.md).
          files: |
            ai-pr-reviewer-*.tgz
            CHECKSUMS.txt
          generate_release_notes: true

      - name: Dry-run — all gates passed, release not published
        if: steps.tag.outputs.dry_run == 'true'
        run: |
          echo "::notice::DRY RUN: tests + pack + checksum all passed for ${{ steps.tag.outputs.tag }}; skipped release creation"
          ls -la ai-pr-reviewer-*.tgz CHECKSUMS.txt
